<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#e8ecf1;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;color:#141a22}
.scene{width:1200px;height:675px;padding:32px 42px;background:#f4f6f9;position:relative}
.top{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;font-weight:750;font-size:19px}
.brand img{width:42px;height:42px;border-radius:11px}
.state{font-size:12px;color:#687586}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#20a469;margin-right:6px}
.muted{color:#7c8997;font:10px ui-monospace,monospace}
.workspace{display:grid;grid-template-columns:0.9fr 1.1fr;gap:16px;margin-top:22px}
.panel{background:white;border:1px solid #dce2e8;border-radius:16px;box-shadow:0 14px 35px #25364a10;overflow:hidden}
.panel-head{padding:13px 16px;border-bottom:1px solid #e1e6eb;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.badge{padding:4px 9px;border-radius:7px;background:#e8f0ff;color:#1f6bf2;font:700 10px ui-monospace,monospace}
.voix{margin:14px;border:1px solid #dce2f0;border-radius:13px;padding:13px 15px;background:#fbfcfe}
.voix .nom{font-size:14px;font-weight:720;display:flex;align-items:center;gap:8px}
.voix .nom .mic{width:22px;height:22px;border-radius:7px;background:#e8f0ff;display:grid;place-items:center;font-size:11px}
.voix .meta{font:10px ui-monospace,monospace;color:#7c8997;margin-top:5px}
.wave{height:52px;display:flex;align-items:center;gap:3px;margin-top:11px}
.wave i{flex:1;background:#bcd2f7;border-radius:2px}
.wave i.on{background:#1f6bf2}
.transcript{font-size:11px;color:#5b6774;margin-top:10px;line-height:1.45;font-style:italic}
.ghost{margin:12px 14px;border:1px dashed #cdd6e0;border-radius:13px;padding:16px;text-align:center;color:#8b97a6;font-size:11.5px}
.ghost b{display:block;color:#141a22;font-size:13px;margin-bottom:4px}
.gen-body{padding:16px}
textarea{width:100%;height:110px;resize:none;border:1px solid #dce2e8;border-radius:12px;padding:12px;font:400 13px/1.5 -apple-system,sans-serif;color:#141a22;background:#fbfcfd;outline:none}
.opts{display:flex;gap:8px;margin-top:12px}
.opt{padding:7px 12px;border-radius:9px;border:1px solid #dce2e8;background:white;font-size:11px;font-weight:640;color:#445060}
.opt.sel{background:#1f6bf2;border-color:#1f6bf2;color:white}
.actions{display:flex;justify-content:flex-end;align-items:center;gap:12px;margin-top:16px}
.status{font:700 11px ui-monospace,monospace;color:#7c8997}
.btn{padding:11px 20px;border-radius:11px;border:1px solid #dce2e8;background:white;font-size:13px}
.btn.primary{background:#1f6bf2;color:white;border-color:#1f6bf2;font-weight:720;box-shadow:0 8px 18px #1f6bf235}
.progress{height:5px;background:#e6ebf2;border-radius:3px;margin-top:16px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:#1f6bf2;border-radius:3px}
.result{margin:0 14px 14px;border:1px solid #d3e4d8;border-radius:13px;padding:13px 15px;background:#f6fbf7;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s}
.result.show{opacity:1;transform:none}
.result .head{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:720}
.result .ok{width:20px;height:20px;border-radius:50%;background:#22a06b;color:white;display:grid;place-items:center;font-size:11px}
.result .dur{margin-left:auto;font:10px ui-monospace,monospace;color:#7c8997}
.playrow{display:flex;align-items:center;gap:12px;margin-top:11px}
.play{width:38px;height:38px;border-radius:50%;background:#1f6bf2;color:white;border:none;font-size:14px;flex:none;box-shadow:0 6px 14px #1f6bf238}
.wave2{flex:1;height:44px;display:flex;align-items:center;gap:3px}
.wave2 i{flex:1;background:#9db9ee;border-radius:2px}
.wave2 i.played{background:#1f6bf2}
.head2{position:absolute;left:0;top:0;bottom:0;width:0;background:#1f6bf212}
.cursor{position:absolute;z-index:20;width:28px;height:34px;left:905px;top:610px;filter:drop-shadow(0 3px 3px #0005);transition:left .65s ease-in-out,top .65s ease-in-out,transform .15s}
.cursor svg{width:100%;height:100%}
.pulse{position:absolute;width:12px;height:12px;border:2px solid #1f6bf2;border-radius:50%;opacity:0;transform:scale(.4)}
.click .cursor{transform:scale(.82)}
.click .pulse{opacity:1;animation:ring .45s ease-out}@keyframes ring{to{opacity:0;transform:scale(3)}}
</style></head><body><div class="scene" id="scene">
<div class="top">
  <div class="brand"><img src="../../icon.png">PK Voice Cloner <span class="state"><i class="dot"></i>Prêt</span></div>
  <span class="badge">moteur · VoxCPM2</span>
</div>
<div class="workspace">
  <div class="panel">
    <div class="panel-head">Ta voix <span class="muted">1 voix · locale</span></div>
    <div class="voix">
      <div class="nom"><span class="mic">🎙</span>Ma voix <span class="badge">48 kHz</span></div>
      <div class="meta">référence · 14,2 s · transcript vérifié</div>
      <div class="wave" id="wave1"></div>
      <div class="transcript">« Voilà un extrait de ma voix pour le clonage, avec le rythme naturel de ma parole. »</div>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head">Générer <span class="muted" id="status">prêt</span></div>
    <div class="gen-body">
      <textarea id="text">Bienvenue dans PK Voice Cloner : ta voix, clonée localement, jamais envoyée sur un serveur.</textarea>
      <div class="opts"><span class="opt sel">VoxCPM2</span><span class="opt">dots.tts</span><span class="opt">Whisper</span></div>
      <div class="actions"><span class="status" id="pct"></span><button class="btn primary" id="gen">Générer</button></div>
      <div class="progress"><i id="bar"></i></div>
    </div>
    <div class="result" id="result">
      <div class="head"><span class="ok">✓</span> clone_20260917.wav <span class="dur">0:07 · 48 kHz</span></div>
      <div class="playrow"><button class="play" id="play">▶</button>
        <div class="wave2" id="wave2"><div class="head2" id="head"></div></div>
      </div>
    </div>
  </div>
</div>
<div class="cursor" id="cursor"><div class="pulse"></div><svg viewBox="0 0 30 38"><path d="M2 2v29l8-8 6 13 5-3-6-12h11z" fill="white" stroke="#111" stroke-width="2"/></svg></div>
</div><script>
const wait=n=>new Promise(r=>setTimeout(r,n)),rnd=(a,b)=>a+Math.random()*(b-a);
const scene=document.querySelector('#scene'),cursor=document.querySelector('#cursor');
function bars(el,n){for(let i=0;i<n;i++){const b=document.createElement('i');b.style.height=rnd(14,100)+'%';el.appendChild(b)}return[...el.children]}
const w1=bars(document.querySelector('#wave1'),34),w2=bars(document.querySelector('#wave2'),46);
const head=document.querySelector('#head');head.style.position='absolute';
async function run(){
  await wait(600);
  cursor.style.left='1042px';cursor.style.top='566px';await wait(650);
  scene.classList.add('click');await wait(160);scene.classList.remove('click');
  document.querySelector('#status').textContent='génération sur MPS…';document.querySelector('#pct').textContent='42 %';
  const bar=document.querySelector('#bar');bar.style.transition='width 2.3s linear';bar.style.width='100%';
  for(let f=0;f<23;f++){document.querySelector('#pct').textContent=Math.round(42+f*2.5)+' %';w1.forEach(b=>b.classList.toggle('on',Math.random()>0.55));await wait(100)}
  w1.forEach(b=>b.classList.add('on'));
  document.querySelector('#status').textContent='terminé';document.querySelector('#pct').textContent='';
  document.querySelector('#result').classList.add('show');
  await wait(500);
  cursor.style.left='210px';cursor.style.top='585px';await wait(650);
  scene.classList.add('click');await wait(160);scene.classList.remove('click');
  document.querySelector('#play').textContent='❚❚';
  for(let f=0;f<20;f++){const t=(f+1)/20;head.style.width=(t*100)+'%';w2.forEach((b,i)=>b.classList.toggle('played',i/46<t));await wait(100)}
  document.querySelector('#play').textContent='▶';w2.forEach(b=>b.classList.remove('played'));head.style.width='0';
  await wait(900);
}
run();
</script></body></html>
