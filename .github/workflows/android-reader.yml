name: Android Reader

on:
  workflow_dispatch:
  push:
    branches: [feat/android-reader, dev, main]
    paths:
      - 'android/**'
      - 'src/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - '.github/workflows/android-reader.yml'

permissions:
  contents: write

concurrency:
  group: android-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Lire la version de l'application
        id: version
        run: |
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
          test -n "$VERSION" || { echo "Version introuvable dans package.json"; exit 1; }
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version de l'application : $VERSION"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Verify book imports and gateway
        run: |
          pnpm test
          python3 -m unittest discover -s src/mobile/tests -p 'test_*.py'
      - run: pnpm mobile:prepare
      - run: pnpm android:deps
      - name: Compile APK and Android tests
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --stacktrace
      - name: Vérifier le nom et la version de l'APK
        run: |
          APK="android/app/build/outputs/apk/debug/PK-Reader-${{ steps.version.outputs.name }}-debug.apk"
          if [ ! -f "$APK" ]; then echo "APK introuvable : $APK"; find android/app/build/outputs/apk -name '*.apk'; exit 1; fi
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT" dump badging "$APK" | grep -E '^package:'
          "$AAPT" dump badging "$APK" | grep -q "versionName='${{ steps.version.outputs.name }}'" \
            || { echo "Le versionName de l'APK ne correspond pas à ${{ steps.version.outputs.name }}"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: PK-Reader-${{ steps.version.outputs.name }}-debug
          path: android/app/build/outputs/apk/debug/PK-Reader-*-debug.apk
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline synthesis and playback service
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: cd android && ./gradlew :app:connectedDebugAndroidTest --stacktrace
      - name: Publier l’APK sur la release pk-<version>
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          TAG="pk-$VERSION"
          APK="PK-Reader-$VERSION-debug.apk"
          cp "android/app/build/outputs/apk/debug/$APK" "$APK"
          # La dernière livraison Android reste la release VISIBLE : release complète
          # marquée « Latest » — GitHub refuse ce badge aux préreleases.
          SECTION=$(awk -v ent="## [$VERSION]" 'index($0,ent)==1{d=1;next} d&&/^## /{exit} d{print}' src/mobile/CHANGELOG.md)
          NOTES="APK du lecteur Android, version $VERSION.

          - Build : $GITHUB_SHA
          - Branche : $GITHUB_REF_NAME"
          if [ -n "$SECTION" ]; then
            NOTES="$SECTION

          ---

          $NOTES"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK" \
              --title "PK Reader Android · $VERSION" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
          URL="$GITHUB_SERVER_URL}/$GITHUB_REPOSITORY/releases/download/$TAG/$APK"
          echo "APK : $URL"
          {
            echo "### APK — version $VERSION"
            echo
            echo "Téléchargement direct : [$APK]($URL)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-check-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
