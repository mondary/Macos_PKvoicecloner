apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

/* Version unique pour le paquet : package.json est la source de vérité.
   On peut la forcer ponctuellement avec -PpkVersionName / -PpkVersionCode. */
def pkPackage = new groovy.json.JsonSlurper().parse(file('../../package.json'))
def pkVersionName = (project.findProperty('pkVersionName') ?: pkPackage.version).toString()
def pkVersionCode = ((project.findProperty('pkVersionCode') ?: pkVersionName.replaceAll('[^0-9]', '')) as String).toInteger()

/* Clé de signature permanente : sans elle, chaque build GitHub crée une
   nouvelle clé debug et Android refuse la mise à jour sans désinstallation.
   Le workflow fournit le keystore par PK_KEYSTORE_PATH ; un build local sans
   cette variable reste signé par la clé debug, pour les essais uniquement. */
def pkStorePath = System.getenv("PK_KEYSTORE_PATH")
def pkStorePassword = System.getenv("PK_KEYSTORE_PASSWORD")
def pkKeyAlias = System.getenv("PK_KEY_ALIAS") ?: "pk-reader"
def pkKeyPassword = System.getenv("PK_KEY_PASSWORD") ?: pkStorePassword
def pkSigningReady = pkStorePath != null && new File(pkStorePath).exists() &&
    pkStorePassword != null && !pkStorePassword.isEmpty()

android {
    namespace = "fr.pk.reader"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "fr.pk.reader"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode pkVersionCode
        versionName pkVersionName
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    kotlinOptions { jvmTarget = '21' }
    if (pkSigningReady) {
        signingConfigs {
            stable {
                storeFile file(pkStorePath)
                storePassword pkStorePassword
                keyAlias pkKeyAlias
                keyPassword pkKeyPassword
                storeType "PKCS12"
            }
        }
    }
    buildTypes {
        debug {
            if (pkSigningReady) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            if (pkSigningReady) {
                signingConfig signingConfigs.stable
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

/* Le fichier APK porte la version : PK-Reader-2026.10.51-debug.apk */
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("PK-Reader-${pkVersionName}-${variant.buildType}.apk")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation files('libs/sherpa-onnx.aar')
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
